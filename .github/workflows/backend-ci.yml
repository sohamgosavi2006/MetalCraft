name: MetalCraft Cloud Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/backend-ci.yml'
      - 'render.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'web/**'

jobs:
  test-and-validate:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          GEMINI_API_KEY: ""
          PARALLEL_API_KEY: ""
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest backend/tests/test_backend.py -v

      - name: Verify Docker Container Build
        run: |
          docker build -t metalcraft-backend:test -f backend/Dockerfile .
