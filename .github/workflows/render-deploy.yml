name: Deploy to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'render.yaml'

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Deploy to Render Webhook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render auto-deployment via Webhook..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment hook triggered successfully."
