name: Deploy to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'render.yaml'
      - '.github/workflows/render-deploy.yml'

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' || secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK || secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render auto-deployment via Webhook..."
          curl -fsSL -X POST "$RENDER_HOOK"
          echo "Render deployment hook triggered successfully."
